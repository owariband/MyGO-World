[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "generative-go-world-runtime"
version = "0.1.0"
description = "Typed Python and LangChain runtime for Generative Go World"
requires-python = ">=3.12,<4.0"
dependencies = [
  "langchain-core==1.6.1",
  "langchain-openai==1.6.0",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["agent_runtime/tests"]

[tool.pyright]
include = ["agent_runtime"]
exclude = ["agent_runtime/testdata"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "C4", "DTZ", "LOG", "PERF", "RUF", "SIM", "T20", "TRY"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"agent_runtime/tests/**/*.py" = ["ANN201", "RUF001"]
