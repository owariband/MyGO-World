[project]
name = "mygo-world"
version = "0.1.0"
description = "Durable generative world runtime for MyGO"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-evals>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
mygo-world = "mygo_world.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mygo_world"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
testpaths = ["tests_py"]
markers = [
  "live: explicit paid tests that require Provider credentials and external MyGO assets",
]
