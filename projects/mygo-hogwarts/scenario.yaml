locations:
  - id: room-of-requirement
    name: 有求必应屋
    description: >-
      Hogwarts 城堡里的隐藏房间，因十名四年级学生需要完成魔咒课与魔药课联合实践而出现。
      房间仿照魔咒学教室布置了四组课桌、漂浮咒练习区与一口黄铜坩埚；四组相隔交谈，
      但所有人仍能看见同一批公开教具。

objects:
  - id: resonance-calibrator
    name: 共鸣校准器
    kind: magical-instrument
    description: 一枚悬在中央工作台上的黄铜音叉，会把不稳定的魔法共鸣显示为不同颜色。
    locationId: room-of-requirement
    state: uncalibrated
    operations:
      - operationId: calibrate
        fromState: uncalibrated
        toState: calibrated
        resultText: 共鸣校准器发出清澈的基准音，原本游移的颜色稳定下来。
  - id: constellation-score
    name: 星图谱页
    kind: magical-score
    description: 一张折叠的深蓝谱页，表面有会随音高移动的银色星点。
    locationId: room-of-requirement
    state: folded
    operations:
      - operationId: unfold
        fromState: folded
        toState: open
        resultText: 星图谱页在桌面展开，银色星点排列成等待演奏的旋律轨迹。
  - id: enchanted-keyboard
    name: 魔法键盘
    kind: magical-instrument
    description: 一架会让和弦化作可见光纹的键盘，目前琴键没有发光。
    locationId: room-of-requirement
    state: muted
    operations:
      - operationId: awaken
        fromState: muted
        toState: resonating
        resultText: 魔法键盘被唤醒，按键上方浮现出等待接续的微弱光纹。
  - id: floating-metronome
    name: 浮空节拍器
    kind: magical-instrument
    description: 一台悬在鼓架旁的木制节拍器，可以为分散的演奏者提供同一个拍点。
    locationId: room-of-requirement
    state: stopped
    operations:
      - operationId: start
        fromState: stopped
        toState: ticking
        resultText: 浮空节拍器开始摆动，清楚的拍点传遍房间。
  - id: self-writing-score
    name: 自动记谱羊皮纸
    kind: magical-score
    description: 一卷配有羽毛笔的羊皮纸，只会记录房间里已经实际奏出的声音。
    locationId: room-of-requirement
    state: idle
    operations:
      - operationId: begin-recording
        fromState: idle
        toState: recording
        resultText: 羽毛笔浮到羊皮纸上方，开始等待下一段真实奏出的旋律。
  - id: levitation-feathers
    name: 漂浮咒练习羽毛
    kind: charms-practice
    description: 弗立维教授留下的一排白色羽毛，需要用标准咒语和清晰的魔杖动作稳定悬浮。
    locationId: room-of-requirement
    state: resting
    operations:
      - operationId: cast-wingardium-leviosa
        fromState: resting
        toState: levitating
        resultText: “Wingardium Leviosa”咒音落下，白色羽毛依次升起，在课桌上方稳定悬浮。
  - id: resonance-cauldron
    name: 共鸣药剂坩埚
    kind: potion-cauldron
    description: >-
      一口装着魔药课半成品的黄铜坩埚，艾草浸液与月长石粉已经称量好，必须按正确方向
      搅拌并控制火候，才能成为承载声音魔咒的共鸣药剂。
    locationId: room-of-requirement
    state: ingredients-measured
    operations:
      - operationId: brew-resonance-draught
        fromState: ingredients-measured
        toState: simmering
        resultText: 坩埚被顺时针搅拌三圈，银蓝色药液开始小火翻涌，散出可供声音魔咒附着的薄雾。

publicFacts:
  - id: cross-house-assignment
    subject:
      kind: location
      id: room-of-requirement
    predicate: current_assignment
    object: charms_and_potions_practicum
    content: >-
      弗立维教授布置了四年级跨院联合实践：在晚餐前，以至少两个学院的声音完成一次
      稳定的声音魔咒；必须实际挥杖施咒，并使用上午魔药课留下的共鸣药剂作为魔力媒介，
      不能只靠讨论宣称完成。谱页、校准器、乐器、羽毛与坩埚需要由学生自行组合与调整。
  - id: charms-practicum-rules
    subject:
      kind: location
      id: room-of-requirement
    predicate: current_lesson
    object: fourth_year_charms_practicum
    content: >-
      当前是弗立维教授安排的四年级魔咒学实践时段。每组至少要完成一次有明确咒音、
      魔杖动作和可观察结果的施咒；漂浮咒练习羽毛可用于校验“Wingardium Leviosa”的稳定性。
  - id: potions-carryover
    subject:
      kind: object
      id: resonance-cauldron
    predicate: prepared_during
    object: fourth_year_potions
    content: >-
      共鸣药剂的配料来自当天上午的四年级魔药课。艾草浸液、月长石粉、顺时针三圈和
      持续小火都是板书上的必要步骤；顺序错误会让药液失去承载声音魔咒的能力。
  - id: dinner-deadline
    subject:
      kind: world
    predicate: deadline
    object: "18:30"
    content: 晚餐在十八点三十分开始，共鸣实践需要在那之前完成或提交当前结果。
